<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 导航 - 发现最实用的 AI 工具</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    
    body {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
      min-height: 100vh;
    }
    
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .glow {
      box-shadow: 0 0 60px rgba(102, 126, 234, 0.4);
    }
    
    .tool-card {
      transition: all 0.3s ease;
    }
    
    .tool-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
    }
    
    .category-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    
    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
      50% { box-shadow: 0 0 40px rgba(102, 126, 234, 0.8); }
    }
    
    .bg-grid {
      background-image: 
        linear-gradient(rgba(102, 126, 234, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102, 126, 234, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="text-white bg-grid">
  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 glass">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-xl">
          🚀
        </div>
        <span class="text-xl font-bold gradient-text">AI 导航</span>
      </div>
      <div class="flex items-center gap-4">
        <span class="text-sm text-gray-400" id="update-time"></span>
        <a href="https://github.com" target="_blank" class="text-gray-400 hover:text-white transition">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
        </a>
      </div>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="pt-32 pb-16 px-4 text-center relative overflow-hidden">
    <div class="absolute inset-0 overflow-hidden">
      <div class="absolute top-20 left-10 w-72 h-72 bg-purple-500/20 rounded-full blur-3xl floating"></div>
      <div class="absolute top-40 right-10 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl floating" style="animation-delay: -3s;"></div>
      <div class="absolute bottom-0 left-1/2 w-80 h-80 bg-pink-500/20 rounded-full blur-3xl floating" style="animation-delay: -1.5s;"></div>
    </div>
    
    <div class="relative z-10 max-w-4xl mx-auto">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass mb-6">
        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
        <span class="text-sm text-gray-300">收录 <span class="text-white font-semibold" id="total-count">0</span> 个精选 AI 工具</span>
      </div>
      
      <h1 class="text-5xl md:text-7xl font-extrabold mb-6 leading-tight">
        发现<span class="gradient-text">最实用</span>的<br>AI 工具
      </h1>
      
      <p class="text-xl text-gray-400 mb-10 max-w-2xl mx-auto">
        精心整理各类 AI 工具，从 ChatGPT 到 Midjourney，从编程助手到设计神器
      </p>
      
      <!-- Search -->
      <div class="max-w-2xl mx-auto relative">
        <input 
          type="text" 
          id="search-input"
          placeholder="搜索 AI 工具..."
          class="w-full px-6 py-4 pl-14 rounded-2xl glass text-lg focus:outline-none focus:ring-2 focus:ring-purple-500 transition"
        >
        <svg class="absolute left-5 top-1/2 -translate-y-1/2 w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
      </div>
    </div>
  </section>

  <!-- Categories -->
  <section class="px-4 pb-8">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-wrap justify-center gap-3" id="categories">
        <button class="category-btn active px-5 py-2.5 rounded-full glass text-sm font-medium transition" data-category="all">
          全部
        </button>
        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10" data-category="chatbot">
          🤖 对话助手
        </button>
        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10" data-category="image">
          🎨 图像生成
        </button>
        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10" data-category="video">
          🎬 视频制作
        </button>
        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10" data-category="audio">
          🎵 音频处理
        </button>
        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10" data-category="coding">
          💻 编程开发
        </button>
        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10" data-category="productivity">
          📊 办公效率
        </button>
        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10" data-category="search">
          🔍  AI 搜索
        </button>
        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10" data-category="learning">
          📚 学习教育
        </button>
      </div>
    </div>
  </section>

  <!-- Hot Tools -->
  <section class="px-4 pb-8 hidden" id="hot-section">
    <div class="max-w-7xl mx-auto">
      <div class="flex items-center gap-3 mb-6">
        <span class="text-2xl">🔥</span>
        <h2 class="text-2xl font-bold">热门推荐</h2>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="hot-tools"></div>
    </div>
  </section>

  <!-- All Tools -->
  <section class="px-4 pb-20">
    <div class="max-w-7xl mx-auto">
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🛠️</span>
          <h2 class="text-2xl font-bold" id="section-title">所有工具</h2>
        </div>
        <span class="text-gray-400 text-sm" id="current-count">0 个工具</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="tools-grid"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="glass py-8 px-4">
    <div class="max-w-7xl mx-auto text-center">
      <p class="text-gray-400 mb-2">
        由 <span class="gradient-text font-semibold">AI 导航</span> 精心整理
      </p>
      <p class="text-sm text-gray-500">
        持续更新 · 发现更多 AI 工具
      </p>
    </div>
  </footer>

  <script>
    // Data
    let tools = [];
    let currentCategory = 'all';
    let searchQuery = '';

    // Load data
    async function loadTools() {
      try {
        const response = await fetch('tools.json');
        tools = await response.json();
        document.getElementById('total-count').textContent = tools.length;
        document.getElementById('update-time').textContent = new Date().toLocaleDateString('zh-CN');
        renderTools();
        renderHotTools();
      } catch (error) {
        console.error('Failed to load tools:', error);
      }
    }

    // Category mapping
    const categoryNames = {
      all: '所有工具',
      chatbot: '对话助手',
      image: '图像生成',
      video: '视频制作',
      audio: '音频处理',
      coding: '编程开发',
      productivity: '办公效率',
      search: 'AI 搜索',
      learning: '学习教育'
    };

    // Filter tools
    function getFilteredTools() {
      return tools.filter(tool => {
        const matchCategory = currentCategory === 'all' || tool.category === currentCategory;
        const matchSearch = searchQuery === '' || 
          tool.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          tool.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
          tool.tags.some(tag => tag.toLowerCase().includes(searchQuery.toLowerCase()));
        return matchCategory && matchSearch;
      });
    }

    // Render tools
    function renderTools() {
      const filtered = getFilteredTools();
      const grid = document.getElementById('tools-grid');
      const hotSection = document.getElementById('hot-section');
      
      document.getElementById('current-count').textContent = `${filtered.length} 个工具`;
      document.getElementById('section-title').textContent = categoryNames[currentCategory];

      // Show/hide hot section
      if (currentCategory === 'all' && searchQuery === '') {
        hotSection.classList.remove('hidden');
      } else {
        hotSection.classList.add('hidden');
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-20">
            <div class="text-6xl mb-4">🔍</div>
            <p class="text-xl text-gray-400">没有找到匹配的工具</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(tool => `
        <a href="${tool.url}" target="_blank" class="tool-card block glass rounded-2xl p-5 group">
          <div class="flex items-start gap-4">
            <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500/20 to-blue-500/20 flex items-center justify-center text-2xl shrink-0">
              ${tool.icon}
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 mb-1">
                <h3 class="font-semibold text-lg truncate group-hover:text-purple-400 transition">${tool.name}</h3>
                ${tool.hot ? '<span class="px-2 py-0.5 bg-red-500/20 text-red-400 text-xs rounded-full">HOT</span>' : ''}
              </div>
              <p class="text-gray-400 text-sm line-clamp-2 mb-3">${tool.description}</p>
              <div class="flex flex-wrap gap-2">
                ${tool.tags.map(tag => `<span class="px-2 py-1 bg-white/5 rounded-md text-xs text-gray-400">${tag}</span>`).join('')}
              </div>
            </div>
          </div>
          <div class="mt-4 pt-4 border-t border-white/5 flex items-center justify-between">
            <span class="text-xs text-gray-500">${categoryNames[tool.category]}</span>
            <span class="text-sm text-purple-400 opacity-0 group-hover:opacity-100 transition flex items-center gap-1">
              访问
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
              </svg>
            </span>
          </div>
        </a>
      `).join('');
    }

    // Render hot tools
    function renderHotTools() {
      const hotTools = tools.filter(tool => tool.hot);
      const container = document.getElementById('hot-tools');
      
      container.innerHTML = hotTools.map(tool => `
        <a href="${tool.url}" target="_blank" class="tool-card block glass rounded-2xl p-5 group pulse-glow">
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-orange-500/20 to-red-500/20 flex items-center justify-center text-3xl shrink-0">
              ${tool.icon}
            </div>
            <div>
              <h3 class="font-bold text-lg group-hover:text-orange-400 transition flex items-center gap-2">
                ${tool.name}
                <span class="px-2 py-0.5 bg-red-500/20 text-red-400 text-xs rounded-full">🔥 热门</span>
              </h3>
              <p class="text-gray-400 text-sm mt-1">${tool.description}</p>
            </div>
          </div>
        </a>
      `).join('');
    }

    // Event listeners
    document.getElementById('categories').addEventListener('click', (e) => {
      if (e.target.classList.contains('category-btn')) {
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        renderTools();
      }
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTools();
    });

    // Initialize
    loadTools();
  </script>
</body>
</html>
