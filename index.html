  <style>
    * { font-family: 'Inter', system-ui, sans-serif; }
    
    body {
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a3e 50%, #0f0f23 100%);
      min-height: 100vh;
    }
    
    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .glow {
      box-shadow: 0 0 60px rgba(102, 126, 234, 0.4);
    }
    
    .tool-card {
      transition: all 0.3s ease;
      position: relative;
    }
    
    .tool-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(102, 126, 234, 0.3);
    }
    
    .tool-card .copy-hint {
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s ease;
    }
    
    .tool-card:hover .copy-hint {
      opacity: 1;
      transform: translateY(0);
    }
    
    .category-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .floating {
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    
    .pulse-glow {
      animation: pulse-glow 2s ease-in-out infinite;
    }
    
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(102, 126, 234, 0.5); }
      50% { box-shadow: 0 0 40px rgba(102, 126, 234, 0.8); }
    }
    
    .bg-grid {
      background-image: 
        linear-gradient(rgba(102, 126, 234, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(102, 126, 234, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }
    
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    
    .search-suggestions {
      display: none;
    }
    
    .search-suggestions.show {
      display: block;
    }
    
    .toast {
      animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
    }
    
    @keyframes slideIn {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    
    .favorite-btn {
      transition: all 0.2s ease;
    }
    
    .favorite-btn.active {
      color: #f59e0b;
    }
  </style>
</head>

  <!-- Hero Section -->

      <div class="absolute bottom-0 left-1/2 w-80 h-80 bg-pink-500/20 rounded-full blur-3xl floating" style="animation-delay: -1.5s;"></div>
    </div>
    
    <div class="relative z-10 max-w-4xl mx-auto">
      <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full glass mb-6">
        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
        <span class="text-sm text-gray-300">收录 <span class="text-white font-semibold" id="total-count">0</span> 个精选 AI 工具</span>
        <span class="text-gray-500">·</span>

      <!-- Search -->

  <!-- Categories -->
  <section class="px-4 pb-8">
    <div class="max-w-7xl mx-auto">
      <div class="flex flex-nowrap justify-center gap-3 overflow-x-auto scrollbar-hide pb-2" id="categories" style="scrollbar-width: none; -ms-overflow-style: none;">
        <button class="category-btn active px-5 py-2.5 rounded-full glass text-sm font-medium transition shrink-0" data-category="all">

        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10 shrink-0" data-category="chatbot">

        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10 shrink-0" data-category="image">

        <button class="category-btn px-5 py-2.5 rounded-full glass text-sm font-medium transition hover:bg-white/10 shrink-0" data-category="video">

  <!-- Hot Tools -->
  <section class="px-4 pb-8 hidden" id="hot-section">

  <!-- All Tools -->
  <section class="px-4 pb-20">
    <div class="max-w-7xl mx-auto">
      <div class="flex items-center justify-between mb-6 flex-wrap gap-4">
        <div class="flex items-center gap-3">
          <span class="text-2xl">🛠️</span>
          <h2 class="text-2xl font-bold" id="section-title">所有工具</h2>
        </div>
        <div class="flex items-center gap-3">
          <span class="text-gray-400 text-sm" id="current-count">0 个工具</span>
          <button id="toggle-favorites" class="px-4 py-1.5 rounded-full glass text-sm hover:bg-white/10 transition flex items-center gap-2">
            <span>⭐</span>
            <span id="fav-text">只看收藏</span>
          </button>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5" id="tools-grid"></div>

  <!-- Footer -->
  <footer class="glass py-8 px-4">
    <div class="max-w-7xl mx-auto text-center">
      <p class="text-gray-400 mb-2">
        由 <span class="gradient-text font-semibold">AI 导航</span> 精心整理 · 
        <a href="https://github.com/yuyezhizhi/ai-nav-site" target="_blank" class="text-purple-400 hover:underline">Star on GitHub</a>

      <p class="text-sm text-gray-500">
        持续更新 · 发现更多 AI 工具 · 建议用浏览器收藏本站
      </p>
    </div>
  </footer>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

  <script>
    // Data
    let tools = [];
    let currentCategory = 'all';
    let searchQuery = '';
    let showFavoritesOnly = false;
    let favorites = JSON.parse(localStorage.getItem('ai-nav-favorites') || '[]');

    // Load data
    async function loadTools() {
      try {
        const response = await fetch('tools.json');
        tools = await response.json();
        
        // Update visit count
        const visitCount = parseInt(localStorage.getItem('ai-nav-visits') || '0') + 1;
        localStorage.setItem('ai-nav-visits', visitCount.toString());
        
        document.getElementById('total-count').textContent = tools.length;
        document.getElementById('visit-count').textContent = visitCount;
        document.getElementById('update-time').textContent = new Date().toLocaleDateString('zh-CN');
        renderTools();
        renderHotTools();
      } catch (error) {
        console.error('Failed to load tools:', error);
      }
    }

    // Category mapping
    const categoryNames = {
      all: '所有工具',
      chatbot: '对话助手',
      image: '图像生成',
      video: '视频制作',
      audio: '音频处理',
      coding: '编程开发',
      productivity: '办公效率',
      search: 'AI 搜索',
      learning: '学习教育'
    };

    // Filter tools
    function getFilteredTools() {
      return tools.filter(tool => {
        const matchCategory = currentCategory === 'all' || tool.category === currentCategory;
        const matchSearch = searchQuery === '' || 
          tool.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          tool.description.toLowerCase().includes(searchQuery.toLowerCase()) ||
          tool.tags.some(tag => tag.toLowerCase().includes(searchQuery.toLowerCase()));
        const matchFavorite = !showFavoritesOnly || favorites.includes(tool.url);
        return matchCategory && matchSearch && matchFavorite;
      });
    }

    // Toggle favorite
    function toggleFavorite(toolUrl, event) {
      event.preventDefault();
      event.stopPropagation();
      
      if (favorites.includes(toolUrl)) {
        favorites = favorites.filter(url => url !== toolUrl);
        showToast('已取消收藏');
      } else {
        favorites.push(toolUrl);
        showToast('已添加到收藏 ⭐');
      }
      
      localStorage.setItem('ai-nav-favorites', JSON.stringify(favorites));
      renderTools();
      updateFavoriteButtons();
    }

    // Update favorite buttons
    function updateFavoriteButtons() {
      document.querySelectorAll('.favorite-btn').forEach(btn => {
        const url = btn.dataset.url;
        if (favorites.includes(url)) {
          btn.classList.add('active');
          btn.innerHTML = '⭐';
        } else {
          btn.classList.remove('active');
          btn.innerHTML = '☆';
        }
      });
    }

    // Show toast
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast glass px-4 py-2 rounded-lg text-sm';
      toast.textContent = message;
      container.appendChild(toast);
      
      setTimeout(() => toast.remove(), 3000);
    }

    // Copy to clipboard
    function copyToClipboard(text, event) {
      event.preventDefault();
      event.stopPropagation();
      
      navigator.clipboard.writeText(text).then(() => {
        showToast('链接已复制！📋');
      }).catch(() => {
        showToast('复制失败');
      });
    }

    // Render tools
    function renderTools() {
      const filtered = getFilteredTools();
      const grid = document.getElementById('tools-grid');
      const hotSection = document.getElementById('hot-section');
      
      document.getElementById('current-count').textContent = `${filtered.length} 个工具`;
      document.getElementById('section-title').textContent = categoryNames[currentCategory];

      // Show/hide hot section
      if (currentCategory === 'all' && searchQuery === '' && !showFavoritesOnly) {
        hotSection.classList.remove('hidden');
      } else {
        hotSection.classList.add('hidden');
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-20">
            <div class="text-6xl mb-4">🔍</div>
            <p class="text-xl text-gray-400">没有找到匹配的工具</p>
            <p class="text-sm text-gray-500 mt-2">试试其他关键词或分类</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(tool => `
        <div class="tool-card glass rounded-2xl p-5 group relative">
          <div class="absolute top-4 right-4 flex gap-2 z-10">
            <button 
              class="favorite-btn p-2 rounded-lg hover:bg-white/10 transition text-lg ${favorites.includes(tool.url) ? 'active' : ''}"
              data-url="${tool.url}"
              onclick="toggleFavorite('${tool.url}', event)"
              title="${favorites.includes(tool.url) ? '取消收藏' : '收藏'}"
            >
              ${favorites.includes(tool.url) ? '⭐' : '☆'}
            </button>
          </div>
          <a href="${tool.url}" target="_blank" class="block">
            <div class="flex items-start gap-4">
              <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500/20 to-blue-500/20 flex items-center justify-center text-2xl shrink-0">
                ${tool.icon}
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <h3 class="font-semibold text-lg truncate group-hover:text-purple-400 transition">${tool.name}</h3>
                  ${tool.hot ? '<span class="px-2 py-0.5 bg-red-500/20 text-red-400 text-xs rounded-full">HOT</span>' : ''}
                </div>
                <p class="text-gray-400 text-sm line-clamp-2 mb-3">${tool.description}</p>
                <div class="flex flex-wrap gap-2">
                  ${tool.tags.map(tag => `<span class="px-2 py-1 bg-white/5 rounded-md text-xs text-gray-400">${tag}</span>`).join('')}
                </div>
              </div>
            </div>
            <div class="mt-4 pt-4 border-t border-white/5 flex items-center justify-between">
              <span class="text-xs text-gray-500">${categoryNames[tool.category]}</span>
              <div class="flex items-center gap-3">
                <button 
                  class="copy-hint text-xs text-purple-400 hover:text-purple-300 transition flex items-center gap-1"
                  onclick="copyToClipboard('${tool.url}', event)"
                  title="复制链接"
                >
                  📋 复制
                </button>
                <span class="text-sm text-purple-400 opacity-0 group-hover:opacity-100 transition flex items-center gap-1">
                  访问
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                  </svg>
                </span>
              </div>
            </div>
          </a>
        </div>
      `).join('');
      
      updateFavoriteButtons();
    }

    // Render hot tools
    function renderHotTools() {
      const hotTools = tools.filter(tool => tool.hot);
      const container = document.getElementById('hot-tools');
      
      container.innerHTML = hotTools.map(tool => `
        <a href="${tool.url}" target="_blank" class="tool-card block glass rounded-2xl p-5 group pulse-glow relative">
          <div class="absolute top-4 right-4">
            <button 
              class="favorite-btn p-2 rounded-lg hover:bg-white/10 transition text-lg ${favorites.includes(tool.url) ? 'active' : ''}"
              data-url="${tool.url}"
              onclick="toggleFavorite('${tool.url}', event)"
            >
              ${favorites.includes(tool.url) ? '⭐' : '☆'}
            </button>
          </div>
          <div class="flex items-center gap-4">
            <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-orange-500/20 to-red-500/20 flex items-center justify-center text-3xl shrink-0">
              ${tool.icon}
            </div>
            <div>
              <h3 class="font-bold text-lg group-hover:text-orange-400 transition flex items-center gap-2">
                ${tool.name}
                <span class="px-2 py-0.5 bg-red-500/20 text-red-400 text-xs rounded-full">🔥 热门</span>
              </h3>
              <p class="text-gray-400 text-sm mt-1">${tool.description}</p>
            </div>
          </div>
        </a>
      `).join('');
      
      // Update favorite buttons in hot section
      container.querySelectorAll('.favorite-btn').forEach(btn => {
        const url = btn.dataset.url;
        if (favorites.includes(url)) {
          btn.classList.add('active');
          btn.innerHTML = '⭐';
        } else {
          btn.classList.remove('active');
          btn.innerHTML = '☆';
        }
      });
    }

    // Search suggestions
    function showSearchSuggestions(query) {
      const container = document.getElementById('search-suggestions');
      
      if (!query) {
        container.classList.remove('show');
        return;
      }
      
      const suggestions = tools
        .filter(tool => 
          tool.name.toLowerCase().includes(query.toLowerCase()) ||
          tool.tags.some(tag => tag.toLowerCase().includes(query.toLowerCase()))
        )
        .slice(0, 5);
      
      if (suggestions.length === 0) {
        container.innerHTML = '<div class="text-xs text-gray-500 px-3 py-2">无匹配结果</div>';
      } else {
        container.innerHTML = suggestions.map(tool => `
          <button 
            class="w-full text-left px-3 py-2 rounded-lg hover:bg-white/10 transition flex items-center gap-3"
            onclick="selectSuggestion('${tool.name}')"
          >
            <span>${tool.icon}</span>
            <span>${tool.name}</span>
          </button>
        `).join('');
      }
      
      container.classList.add('show');
    }

    // Select suggestion
    function selectSuggestion(name) {
      searchQuery = name;
      document.getElementById('search-input').value = name;
      document.getElementById('search-suggestions').classList.remove('show');
      renderTools();
    }

    // Event listeners
    document.getElementById('categories').addEventListener('click', (e) => {
      if (e.target.classList.contains('category-btn')) {
        document.querySelectorAll('.category-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        currentCategory = e.target.dataset.category;
        renderTools();
      }
    });

    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-search');
    
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      
      if (searchQuery) {
        clearBtn.classList.remove('hidden');
        showSearchSuggestions(searchQuery);
      } else {
        clearBtn.classList.add('hidden');
        document.getElementById('search-suggestions').classList.remove('show');
      }
      
      renderTools();
    });
    
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('search-suggestions').classList.remove('show');
        renderTools();
      }
    });
    
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.add('hidden');
      document.getElementById('search-suggestions').classList.remove('show');
      renderTools();
    });

    // Close suggestions when clicking outside
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#search-input') && !e.target.closest('#search-suggestions')) {
        document.getElementById('search-suggestions').classList.remove('show');
      }
    });

    // Toggle favorites
    document.getElementById('toggle-favorites').addEventListener('click', () => {
      showFavoritesOnly = !showFavoritesOnly;
      const btn = document.getElementById('toggle-favorites');
      const text = document.getElementById('fav-text');
      
      if (showFavoritesOnly) {
        btn.classList.add('bg-purple-500/20');
        text.textContent = '显示全部';
      } else {
        btn.classList.remove('bg-purple-500/20');
        text.textContent = '只看收藏';
      }
      
      renderTools();
    });

    // Initialize
    loadTools();
  </script>
</body>
</html>
